name: Fix Research Formatting
on:
  push:
    branches:
      - feature/research-card-symmetric-encryption
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format completed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @100monkeys/cloud-flow... --filter cloud-flow-demo...
      - run: pnpm exec prettier --write examples/cloud-flow/src/wiki.json examples/cloud-flow/e2e/research-card-integration.spec.ts
      - run: pnpm exec prettier --check examples/cloud-flow/src/wiki.json examples/cloud-flow/e2e/research-card-integration.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/cloud-flow/src/wiki.json examples/cloud-flow/e2e/research-card-integration.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format research browser files [format completed]"
            git push origin HEAD:feature/research-card-symmetric-encryption
          fi
